[project]
name = "black-scholes"
version = "0.1.0"
description = "Black-Scholes option analytics using Polars and Typer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0.0",
  "polars>=1.13.0",
  "scipy>=1.14.0",
  "typer>=0.12.0",
  "rich>=13.0.0",
]

[project.scripts]
black-scholes = "black_scholes.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
